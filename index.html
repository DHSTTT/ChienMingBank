<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Demonstrator</title>

<style>

body{
    margin:0;
    background:#eef2f7;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:360px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    margin-top:0;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#0066cc;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#004b99;
}

#result{
    margin-top:20px;
    padding:12px;
    border-radius:5px;
    text-align:center;
    display:none;
}

.safe{
    background:#d4edda;
    color:#155724;
}

.unsafe{
    background:#f8d7da;
    color:#721c24;
}

.error{
    background:#fff3cd;
    color:#856404;
}

</style>

</head>

<body>

<div class="container">

<h2>Password Demonstrator</h2>

<label>Email</label>
<input
type="email"
id="email"
placeholder="name@example.com">

<label>Password</label>
<input
type="password"
id="password"
placeholder="Enter a password">

<button id="checkButton">
Check Password
</button>

<div id="result"></div>

</div>

<script>

const button = document.getElementById("checkButton");

button.addEventListener("click", checkPassword);

async function checkPassword(){

    const password =
        document.getElementById("password").value.trim();

    const result =
        document.getElementById("result");

    result.style.display = "block";

    if(password.length === 0){

        result.className = "error";
        result.textContent = "Please enter a password.";
        return;

    }

    try{

        const response =
            await fetch("Password-List.txt");

        if(!response.ok){
            throw new Error();
        }

        const text = await response.text();

        const passwords =
            text
            .split(/\r?\n/)
            .map(p => p.trim())
            .filter(p => p !== "");

        if(passwords.includes(password)){

            result.className = "unsafe";
            result.innerHTML =
                "<strong>⚠ Weak Password</strong><br><br>" +
                "This password appears in the demonstration list.";

        }else{

            result.className = "safe";
            result.innerHTML =
                "<strong>✓ Not Found</strong><br><br>" +
                "This password does not appear in the demonstration list.";

        }

    }
    catch(error){

        result.className = "error";
        result.innerHTML =
            "Unable to load <strong>Password-List.txt</strong>.";

        console.error(error);

    }

}

</script>

</body>
</html>
