<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Password Demonstrator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,"Segoe UI",Arial,sans-serif;
    background:linear-gradient(135deg,#2563eb,#4f46e5,#7c3aed);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.95);
    backdrop-filter:blur(18px);
    border-radius:20px;
    padding:40px;
    box-shadow:
        0 20px 50px rgba(0,0,0,.15),
        0 0 0 1px rgba(255,255,255,.2);
    animation:fadeIn .5s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h2{
    text-align:center;
    color:#1f2937;
    margin-bottom:10px;
    font-size:28px;
    font-weight:700;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    font-size:14px;
    margin-bottom:30px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#374151;
    font-size:14px;
    font-weight:600;
}

input{
    width:100%;
    padding:14px 16px;
    border:1px solid #d1d5db;
    border-radius:12px;
    font-size:15px;
    margin-bottom:18px;
    transition:.25s;
    background:#f9fafb;
}

input:focus{
    outline:none;
    border-color:#4f46e5;
    background:white;
    box-shadow:0 0 0 4px rgba(79,70,229,.15);
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 25px rgba(79,70,229,.3);
}

button:active{
    transform:translateY(0);
}

#result{
    display:none;
    margin-top:25px;
    padding:18px;
    border-radius:12px;
    text-align:center;
    font-size:15px;
    line-height:1.5;
    animation:fadeIn .3s ease;
}

.safe{
    background:#ecfdf5;
    color:#065f46;
    border:1px solid #6ee7b7;
}

.unsafe{
    background:#fef2f2;
    color:#991b1b;
    border:1px solid #fca5a5;
}

.error{
    background:#fffbeb;
    color:#92400e;
    border:1px solid #fcd34d;
}

</style>

</head>

<body>

<div class="container">

<h2>Chien Ming Bank</h2>

<label>Email</label>
<input
type="email"
id="email"
placeholder="name@example.com">

<label>Password</label>
<input
type="password"
id="password"
placeholder="Enter a password">

<button id="checkButton">
Check Password
</button>

<div id="result"></div>

</div>

<script>

const button = document.getElementById("checkButton");

button.addEventListener("click", checkPassword);

async function checkPassword(){

    const password =
        document.getElementById("password").value.trim();

    const result =
        document.getElementById("result");

    result.style.display = "block";

    if(password.length === 0){

        result.className = "error";
        result.textContent = "Please enter a password.";
        return;

    }

    try{

        const response =
            await fetch("Password-List.txt");

        if(!response.ok){
            throw new Error();
        }

        const text = await response.text();

        const passwords =
            text
            .split(/\r?\n/)
            .map(p => p.trim())
            .filter(p => p !== "");

        if(passwords.includes(password)){

            result.className = "unsafe";
            result.innerHTML =
                "<strong>⚠ Weak Password</strong><br><br>" +
                "This password appears in the demonstration list.";

        }else{

            result.className = "safe";
            result.innerHTML =
                "<strong>✓ Not Found</strong><br><br>" +
                "This password does not appear in the demonstration list.";

        }

    }
    catch(error){

        result.className = "error";
        result.innerHTML =
            "Unable to load <strong>Password-List.txt</strong>.";

        console.error(error);

    }

}

</script>

</body>
</html>
